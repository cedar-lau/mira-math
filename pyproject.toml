[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-math"
version = "0.1.0"
description = "MIRA-Math: a benchmark for minimal information requesting and mathematical reasoning under partial information."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MIRA-Math contributors" },
]
keywords = ["llm", "benchmark", "multi-agent", "reasoning", "math"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
    "sympy>=1.12",
]

[project.optional-dependencies]
agents = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
mira-math-generate = "mira_math.generate:main"
mira-math-validate = "mira_math.validate:main"

[tool.setuptools.packages.find]
include = ["mira_math*"]
exclude = ["tests*", "examples*", "datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
